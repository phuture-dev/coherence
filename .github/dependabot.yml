# Dependabot configuration for composer dependencies.
# Keeps packages up to date while preserving backward compatibility:
#   - "widen" strategy retains existing constraints and adds new ranges
#   - all semver-major updates are ignored (no breaking changes)
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    versioning-strategy: "widen"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "composer"
    groups:
      symfony-polyfills:
        patterns:
          - "symfony/polyfill-*"
      development:
        dependency-type: "development"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]